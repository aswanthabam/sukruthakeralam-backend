version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ${APP_NAME}_postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbackup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: ${APP_NAME}_pgbackup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/backups/${APP_NAME}_pgbackup:/backups # Backups will be saved in a 'db_backups' folder on your host
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # Required for backup connection
      - SCHEDULE=@daily                        # Run backup once a day at midnight
      - BACKUP_KEEP_DAYS=7                     # Delete backups older than 7 days
      - BACKUP_KEEP_WEEKS=4                    # Keep 1 backup per week for 4 weeks
      - BACKUP_KEEP_MONTHS=6                   # Keep 1 backup per month for 6 months
      - HEALTHCHECK_PORT=8080                  # Optional: port for checking backup status

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}_backend
    restart: unless-stopped
    command: >
      uvicorn app:app --host 0.0.0.0 --port 8000 --workers 4
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./:/backend

volumes:
  postgres_data:
